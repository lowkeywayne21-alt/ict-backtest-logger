<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0e14">
<title>ICT Precision Journal & Logger</title>
<style>
:root {
  --bg-main: #0b0e14;
  --bg-card: #121721;
  --bg-input: #07090d;
  --border: #1e2638;
  --accent-blue: #3b82f6;
  --accent-blue-hover: #2563eb;
  --text-main: #f1f5f9;
  --text-muted: #64748b;
  --green: #10b981;
  --red: #ef4444;
  --cyan: #06b6d4;
  --amber: #f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-main);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding-bottom: 50px;
}

/* NAVBAR & TABS */
header {
  background: rgba(18, 23, 33, 0.8);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: linear-gradient(135deg, #60a5fa, #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav-tabs {
  display: flex;
  gap: 6px;
  background: var(--bg-input);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--border);
}

.tab-btn {
  background: transparent;
  color: var(--text-muted);
  border: 0;
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.tab-btn.active {
  background: var(--accent-blue);
  color: white;
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
}

main {
  max-width: 900px;
  margin: 20px auto;
  padding: 0 15px;
}

.tab-content { display: none; }
.tab-content.active { display: block; }

/* CARDS & FORM UI */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

h2::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}

.wide { grid-column: 1 / -1; }

label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
}

input, select, textarea {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-main);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  outline: none;
  transition: border 0.2s;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--accent-blue);
}

/* CHECKBOX GROUPS */
.checkbox-grid {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  max-height: 150px;
  overflow-y: auto;
}

.check-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-main);
  cursor: pointer;
}

.check-item input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--accent-blue);
  cursor: pointer;
}

/* METRICS DISPLAY */
.live-metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 15px;
}

.metric-box {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  text-align: center;
}

.metric-box span { font-size: 10px; color: var(--text-muted); display: block; margin-bottom: 4px; }
.metric-box b { font-size: 20px; font-weight: 700; }

.open { color: var(--amber); }
.win { color: var(--green); }
.loss { color: var(--red); }
.be { color: var(--cyan); }

/* BUTTONS */
.btn-group { display: flex; gap: 10px; margin-top: 15px; }

button.btn {
  border: 0;
  border-radius: 8px;
  padding: 12px 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  flex: 1;
}

.btn-primary { background: var(--accent-blue); color: white; }
.btn-primary:hover { background: var(--accent-blue-hover); }
.btn-secondary { background: #1e293b; color: var(--text-main); }
.btn-danger { background: #3f1717; color: #fca5a5; }

/* STONK JOURNAL DASHBOARD */
.stonk-metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.stonk-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  text-align: center;
}

.stonk-card p { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; }
.stonk-card h3 { font-size: 18px; font-weight: 700; }

/* JOURNAL TABLE */
.journal-list { display: flex; flex-direction: column; gap: 12px; }

.trade-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.trade-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.badge {
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
}

.badge-WIN { background: rgba(16, 185, 129, 0.15); color: var(--green); }
.badge-LOSS { background: rgba(239, 68, 68, 0.15); color: var(--red); }
.badge-BE { background: rgba(6, 182, 212, 0.15); color: var(--cyan); }
.badge-OPEN { background: rgba(245, 158, 11, 0.15); color: var(--amber); }

.trade-details { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
.trade-details b { color: var(--text-main); }

.img-container {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-top: 6px;
}

.img-container img {
  width: 120px;
  height: 80px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--border);
}

/* MODAL FOR EDITING */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 90%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
}

.url-input-group {
  display: flex;
  gap: 8px;
}

.url-input-group button {
  padding: 0 16px;
}

.preview-box {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-top: 8px;
}

.preview-box img {
  width: 80px;
  height: 60px;
  object-fit: cover;
  border-radius: 6px;
}

@media(max-width: 600px) {
  header { flex-direction: column; gap: 10px; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <div class="brand">ICT BACKTESTER</div>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('logger')">1. Trade Logger</button>
    <button class="tab-btn" onclick="switchTab('journal')">2. Stonk Journal</button>
  </div>
</header>

<main>

  <!-- TAB 1: LOGGER -->
  <div id="logger" class="tab-content active">
    
    <section class="card">
      <h2>Execution Details</h2>
      <div class="grid">
        <label>Date & Time <input id="datetime" type="datetime-local"></label>
        <label>Instrument <input id="symbol" type="text" value="EURUSD"></label>
        <label>Direction 
          <select id="direction">
            <option>BUY</option>
            <option>SELL</option>
          </select>
        </label>
        <label>Entry Price <input id="entry" type="number" step="any" inputmode="decimal"></label>
        <label>Stop Loss <input id="sl" type="number" step="any" inputmode="decimal"></label>
        <label>Take Profit <input id="tp" type="number" step="any" inputmode="decimal"></label>
      </div>

      <div class="live-metrics">
        <div class="metric-box"><span>PLANNED R:R</span><b id="rr">—</b></div>
        <div class="metric-box"><span>STATUS</span><b id="result" class="open">OPEN</b></div>
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary" onclick="calculateRR()">Calculate R:R</button>
        <button class="btn btn-primary" onclick="saveTrade()">Save Trade</button>
      </div>
    </section>

    <section class="card">
      <h2>ICT Context & Attachments</h2>
      <div class="grid">
        <label>HTF Bias
          <select id="htf">
            <option>—</option>
            <option>Bullish</option>
            <option>Bearish</option>
            <option>Neutral</option>
            <option>Bullish POI</option>
            <option>Bearish POI</option>
            <option>Premium</option>
            <option>Discount</option>
          </select>
        </label>

        <label>Killzone Window
          <select id="killzone">
            <option>—</option>
            <option>London</option>
            <option>New York AM</option>
            <option>New York PM</option>
            <option>Silver Bullet</option>
            <option>Outside Killzone</option>
          </select>
        </label>

        <label class="wide">Target Liquidity
          <input id="targetLiquidity" type="text" placeholder="e.g. Asian High, PDH, Equal Highs">
        </label>

        <label class="wide">Liquidity Swept
          <div class="checkbox-grid" id="liquidityGroup">
            <label class="check-item"><input type="checkbox" value="BSL"> BSL</label>
            <label class="check-item"><input type="checkbox" value="SSL"> SSL</label>
            <label class="check-item"><input type="checkbox" value="PDH"> PDH</label>
            <label class="check-item"><input type="checkbox" value="PDL"> PDL</label>
            <label class="check-item"><input type="checkbox" value="Asian High"> Asian High</label>
            <label class="check-item"><input type="checkbox" value="Asian Low"> Asian Low</label>
            <label class="check-item"><input type="checkbox" value="Equal Highs"> Equal Highs</label>
            <label class="check-item"><input type="checkbox" value="Equal Lows"> Equal Lows</label>
          </div>
        </label>

        <label class="wide">Loss / Invalidation Factors
          <div class="checkbox-grid" id="invalidGroup">
            <label class="check-item"><input type="checkbox" value="Against HTF trend"> Against HTF trend</label>
            <label class="check-item"><input type="checkbox" value="Early entry"> Early entry</label>
            <label class="check-item"><input type="checkbox" value="Early BE"> Early BE</label>
            <label class="check-item"><input type="checkbox" value="Reversal"> Reversal</label>
            <label class="check-item"><input type="checkbox" value="Engineered liquidity"> Engineered liquidity</label>
            <label class="check-item"><input type="checkbox" value="Trading to opposing PDA"> Trading to opposing PDA</label>
            <label class="check-item"><input type="checkbox" value="Went to TP"> Went to TP</label>
          </div>
        </label>

        <label class="wide">Upload Local Screenshots
          <input id="imageFile" type="file" accept="image/*" multiple onchange="handleMultipleFiles(event)">
        </label>

        <label class="wide">TradingView Link
          <div class="url-input-group">
            <input id="imageUrl" type="text" placeholder="https://www.tradingview.com/x/...">
            <button class="btn btn-secondary" type="button" onclick="addUrlImage()">Add Link</button>
          </div>
        </label>

        <div class="wide preview-box" id="previewContainer"></div>

        <label class="wide">Setup Notes
          <textarea id="notes" rows="3" placeholder="Context details, emotions, execution mistakes..."></textarea>
        </label>
      </div>
    </section>

  </div>

  <!-- TAB 2: STONK JOURNAL DASHBOARD -->
  <div id="journal" class="tab-content">
    
    <!-- STONK METRICS -->
    <div class="stonk-metrics">
      <div class="stonk-card"><p>TOTAL TRADES</p><h3 id="stTotal">0</h3></div>
      <div class="stonk-card"><p>NET R:R</p><h3 id="stNetRR">0.00R</h3></div>
      <div class="stonk-card"><p>WIN RATE</p><h3 id="stWinRate">0%</h3></div>
      <div class="stonk-card"><p>PROFIT FACTOR</p><h3 id="stProfitFactor">0.00</h3></div>
      <div class="stonk-card"><p>EXPECTANCY</p><h3 id="stExpectancy">0.00R</h3></div>
    </div>

    <div class="btn-group" style="margin-bottom: 20px;">
      <button class="btn btn-secondary" onclick="exportCSV()">Export CSV</button>
      <button class="btn btn-danger" onclick="deleteAllTrades()">Clear All Data</button>
    </div>

    <!-- JOURNAL ENTRIES -->
    <div class="journal-list" id="journalList"></div>

  </div>

</main>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2 style="margin-bottom:12px;">Edit Trade Record</h2>
    <div class="grid">
      <input type="hidden" id="editId">
      <label>Result Status
        <select id="editResult">
          <option value="WIN">WIN</option>
          <option value="LOSS">LOSS</option>
          <option value="BE">BE</option>
          <option value="OPEN">OPEN</option>
        </select>
      </label>
      <label>Entry Price <input id="editEntry" type="number" step="any"></label>
      <label>Stop Loss <input id="editSL" type="number" step="any"></label>
      <label>Take Profit <input id="editTP" type="number" step="any"></label>
      <label class="wide">Target Liquidity <input id="editTargetLiq" type="text"></label>
      <label class="wide">Notes <textarea id="editNotes" rows="3"></textarea></label>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
      <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
let trades = JSON.parse(localStorage.getItem("ICT_BACKTEST_TRADES") || "[]");
let currentImages = [];

function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  
  document.getElementById(tabId).classList.add('active');
  event.target.classList.add('active');

  if(tabId === 'journal') renderStonkJournal();
}

function setAutomaticDateTime(){
  const now = new Date();
  const offset = now.getTimezoneOffset();
  const localTime = new Date(now.getTime() - offset * 60000);
  document.getElementById("datetime").value = localTime.toISOString().slice(0,16);
}

function calculateRR(){
  const entry = parseFloat(document.getElementById("entry").value);
  const sl = parseFloat(document.getElementById("sl").value);
  const tp = parseFloat(document.getElementById("tp").value);
  const direction = document.getElementById("direction").value;

  if(!Number.isFinite(entry) || !Number.isFinite(sl) || !Number.isFinite(tp)){
    document.getElementById("rr").textContent = "—";
    return null;
  }

  let risk = (direction === "BUY") ? (entry - sl) : (sl - entry);
  let reward = (direction === "BUY") ? (tp - entry) : (entry - tp);

  if(risk <= 0 || reward <= 0){
    document.getElementById("rr").textContent = "INVALID";
    return null;
  }

  const rr = reward / risk;
  document.getElementById("rr").textContent = "1:" + rr.toFixed(2);
  return rr;
}

function getSelectedCheckboxes(containerId){
  const container = document.getElementById(containerId);
  return Array.from(container.querySelectorAll("input[type='checkbox']:checked")).map(cb => cb.value);
}

function clearCheckboxes(containerId){
  document.getElementById(containerId).querySelectorAll("input[type='checkbox']").forEach(cb => cb.checked = false);
}

function handleMultipleFiles(event){
  const files = event.target.files;
  if(!files) return;

  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.src = e.target.result;
      img.onload = function(){
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const maxWidth = 700;
        const scale = maxWidth / img.width;
        
        canvas.width = (scale < 1) ? maxWidth : img.width;
        canvas.height = (scale < 1) ? img.height * scale : img.height;

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        currentImages.push(canvas.toDataURL("image/jpeg", 0.65));
        renderPreviews();
      };
    };
    reader.readAsDataURL(file);
  });
}

function addUrlImage(){
  const urlInput = document.getElementById("imageUrl");
  if(urlInput.value.trim() !== ""){
    currentImages.push(urlInput.value.trim());
    urlInput.value = "";
    renderPreviews();
  }
}

function renderPreviews(){
  const previewBox = document.getElementById("previewContainer");
  previewBox.innerHTML = currentImages.map(src => `<img src="${src}">`).join('');
}

function saveTrade(){
  const rr = calculateRR();
  if(rr === null){
    alert("Please complete Entry, Stop Loss, and Take Profit correctly.");
    return;
  }

  const resultInput = prompt("Enter Trade Result (WIN, LOSS, BE, or leave empty for OPEN):", "WIN");
  let result = "OPEN";
  if(resultInput){
    const clean = resultInput.trim().toUpperCase();
    if(["WIN", "LOSS", "BE"].includes(clean)) result = clean;
  }

  const trade = {
    id: Date.now(),
    datetime: document.getElementById("datetime").value,
    symbol: document.getElementById("symbol").value.trim() || "EURUSD",
    direction: document.getElementById("direction").value,
    entry: parseFloat(document.getElementById("entry").value),
    sl: parseFloat(document.getElementById("sl").value),
    tp: parseFloat(document.getElementById("tp").value),
    rr: rr,
    result: result,
    htf: document.getElementById("htf").value,
    killzone: document.getElementById("killzone").value,
    targetLiquidity: document.getElementById("targetLiquidity").value.trim(),
    liquidity: getSelectedCheckboxes("liquidityGroup"),
    invalid: getSelectedCheckboxes("invalidGroup"),
    images: [...currentImages],
    notes: document.getElementById("notes").value.trim()
  };

  trades.push(trade);
  localStorage.setItem("ICT_BACKTEST_TRADES", JSON.stringify(trades));
  
  clearInputs();
  alert("Trade saved to Stonk Journal!");
}

function clearInputs(){
  document.getElementById("notes").value = "";
  document.getElementById("targetLiquidity").value = "";
  document.getElementById("imageFile").value = "";
  document.getElementById("imageUrl").value = "";
  document.getElementById("previewContainer").innerHTML = "";
  clearCheckboxes("liquidityGroup");
  clearCheckboxes("invalidGroup");
  currentImages = [];
}

/* STONK JOURNAL METRICS & RENDER */
function renderStonkJournal(){
  const list = document.getElementById("journalList");
  const total = trades.length;
  
  let totalWins = 0, totalLosses = 0, totalBE = 0;
  let grossWinRR = 0, grossLossRR = 0;

  trades.forEach(t => {
    if(t.result === "WIN") {
      totalWins++;
      grossWinRR += t.rr;
    } else if(t.result === "LOSS") {
      totalLosses++;
      grossLossRR += 1; // 1R Risked per loss
    } else if(t.result === "BE") {
      totalBE++;
    }
  });

  const winRate = (totalWins + totalLosses > 0) ? ((totalWins / (totalWins + totalLosses)) * 100).toFixed(1) : 0;
  const netRR = grossWinRR - grossLossRR;
  const profitFactor = (grossLossRR > 0) ? (grossWinRR / grossLossRR).toFixed(2) : grossWinRR.toFixed(2);
  const expectancy = (totalWins + totalLosses > 0) ? (netRR / (totalWins + totalLosses)).toFixed(2) : 0;

  document.getElementById("stTotal").textContent = total;
  document.getElementById("stNetRR").textContent = `${netRR >= 0 ? '+' : ''}${netRR.toFixed(2)}R`;
  document.getElementById("stWinRate").textContent = `${winRate}%`;
  document.getElementById("stProfitFactor").textContent = profitFactor;
  document.getElementById("stExpectancy").textContent = `${expectancy}R`;

  if(total === 0){
    list.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding:30px;">No trades logged yet.</div>`;
    return;
  }

  list.innerHTML = [...trades].reverse().map(t => {
    const date = new Date(t.datetime).toLocaleString();
    const imgs = t.images || [];
    
    return `
      <div class="trade-card">
        <div class="trade-header">
          <strong>${t.symbol} • ${t.direction}</strong>
          <span class="badge badge-${t.result}">${t.result}</span>
        </div>
        <div class="trade-details">
          <b>Date:</b> ${date} | <b>Planned R:R:</b> 1:${Number(t.rr).toFixed(2)}<br>
          <b>Entry:</b> ${t.entry} | <b>SL:</b> ${t.sl} | <b>TP:</b> ${t.tp}<br>
          <b>HTF:</b> ${t.htf} | <b>KZ:</b> ${t.killzone}<br>
          <b>Target Liq:</b> ${t.targetLiquidity || '—'}<br>
          <b>Swept:</b> ${t.liquidity.join(', ') || 'None'}<br>
          <b>Invalidation:</b> ${t.invalid.join(', ') || 'None'}
          ${t.notes ? `<br><i>Notes: ${t.notes}</i>` : ''}
        </div>
        ${imgs.length > 0 ? `<div class="img-container">${imgs.map(i => `<a href="${i}" target="_blank"><img src="${i}"></a>`).join('')}</div>` : ''}
        <div style="display:flex; gap:8px; margin-top:6px;">
          <button class="btn btn-secondary" style="padding:6px 12px; font-size:11px;" onclick="openEditModal(${t.id})">Edit Trade</button>
          <button class="btn btn-danger" style="padding:6px 12px; font-size:11px;" onclick="deleteSingleTrade(${t.id})">Delete</button>
        </div>
      </div>
    `;
  }).join('');
}

/* EDIT MODAL LOGIC */
function openEditModal(id){
  const t = trades.find(item => item.id === id);
  if(!t) return;

  document.getElementById("editId").value = t.id;
  document.getElementById("editResult").value = t.result;
  document.getElementById("editEntry").value = t.entry;
  document.getElementById("editSL").value = t.sl;
  document.getElementById("editTP").value = t.tp;
  document.getElementById("editTargetLiq").value = t.targetLiquidity || "";
  document.getElementById("editNotes").value = t.notes || "";

  document.getElementById("editModal").style.display = "flex";
}

function closeEditModal(){
  document.getElementById("editModal").style.display = "none";
}

function saveEdit(){
  const id = parseInt(document.getElementById("editId").value);
  const index = trades.findIndex(t => t.id === id);
  if(index === -1) return;

  trades[index].result = document.getElementById("editResult").value;
  trades[index].entry = parseFloat(document.getElementById("editEntry").value);
  trades[index].sl = parseFloat(document.getElementById("editSL").value);
  trades[index].tp = parseFloat(document.getElementById("editTP").value);
  trades[index].targetLiquidity = document.getElementById("editTargetLiq").value;
  trades[index].notes = document.getElementById("editNotes").value;

  // Recalculate RR
  const risk = (trades[index].direction === "BUY") ? (trades[index].entry - trades[index].sl) : (trades[index].sl - trades[index].entry);
  const reward = (trades[index].direction === "BUY") ? (trades[index].tp - trades[index].entry) : (trades[index].entry - trades[index].tp);
  if(risk > 0 && reward > 0) trades[index].rr = reward / risk;

  localStorage.setItem("ICT_BACKTEST_TRADES", JSON.stringify(trades));
  closeEditModal();
  renderStonkJournal();
}

function deleteSingleTrade(id){
  if(!confirm("Delete this trade entry?")) return;
  trades = trades.filter(t => t.id !== id);
  localStorage.setItem("ICT_BACKTEST_TRADES", JSON.stringify(trades));
  renderStonkJournal();
}

function exportCSV(){
  if(trades.length === 0){ alert("No trades available to export."); return; }
  const columns = ["datetime","symbol","direction","entry","sl","tp","rr","result","htf","killzone","targetLiquidity","liquidity","invalid","notes"];
  let csv = columns.join(",") + "\n";

  trades.forEach(t => {
    const row = columns.map(col => {
      let val = t[col] ?? "";
      if(Array.isArray(val)) val = val.join(" | ");
      return '"' + String(val).replace(/"/g, '""') + '"';
    });
    csv += row.join(",") + "\n";
  });

  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "ICT_Stonk_Journal_Export.csv";
  link.click();
}

function deleteAllTrades(){
  if(confirm("Are you sure you want to delete ALL trades?")){
    trades = [];
    localStorage.setItem("ICT_BACKTEST_TRADES", "[]");
    renderStonkJournal();
  }
}

setAutomaticDateTime();
</script>
