<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICT Trade Journal</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#e6edf3;font-family:Inter,Arial,sans-serif}
.wrap{max-width:720px;margin:auto;padding:18px}
header{padding:10px 2px 22px}
h1{font-size:28px;margin:0 0 6px}
.sub{color:#8b949e;font-size:14px}
.card{background:#161b22;border:1px solid #30363d;border-radius:18px;padding:18px;margin-bottom:14px}
.section{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#58a6ff;margin-bottom:14px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;color:#8b949e;margin-bottom:6px}
input,select,textarea{
width:100%;padding:13px;border-radius:11px;border:1px solid #30363d;
background:#0d1117;color:#e6edf3;font-size:15px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:#58a6ff}
textarea{min-height:90px;resize:vertical}
.rr{
background:#0d1117;border:1px solid #30363d;border-radius:13px;
padding:14px;margin-top:12px;display:flex;justify-content:space-between
}
.rr strong{font-size:20px;color:#58a6ff}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button{
border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;
cursor:pointer;background:#238636;color:white
}
button.secondary{background:#21262d}
button.blue{background:#1f6feb}
button.danger{background:#da3633}
button.small{padding:8px 10px;font-size:12px}
.trade{
border:1px solid #30363d;border-radius:14px;padding:14px;margin-top:10px;
background:#0d1117
}
.tradeTop{display:flex;justify-content:space-between;gap:10px}
.badge{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700}
.win{background:#1f6feb33;color:#58a6ff}
.loss{background:#da363333;color:#ff7b72}
.be{background:#8b949e33;color:#c9d1d9}
.open{background:#23863633;color:#7ee787}
.meta{font-size:12px;color:#8b949e;margin-top:5px}
.actions{display:flex;gap:7px;margin-top:10px}
.empty{text-align:center;color:#8b949e;padding:25px}
a{color:#58a6ff;text-decoration:none}
@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>

<body>
<div class="wrap">

<header>
<h1>📝 ICT Trade Journal</h1>
<div class="sub">Log the setup. Review the execution. Improve the model.</div>
</header>

<div class="card">
<div class="section">Trade</div>

<div class="grid">

<div>
<label>Pair / Instrument</label>
<input id="pair" placeholder="EURUSD">
</div>

<div>
<label>Direction</label>
<select id="direction">
<option>BUY</option>
<option>SELL</option>
</select>
</div>

<div>
<label>Trade Date & Time</label>
<input id="datetime" type="datetime-local">
</div>

<div>
<label>Result</label>
<select id="result">
<option>OPEN</option>
<option>WIN</option>
<option>LOSS</option>
<option>BREAKEVEN</option>
</select>
</div>

<div>
<label>Entry</label>
<input id="entry" type="number" step="any" placeholder="1.19619">
</div>

<div>
<label>Stop Loss</label>
<input id="sl" type="number" step="any" placeholder="1.19706">
</div>

<div>
<label>Take Profit</label>
<input id="tp" type="number" step="any" placeholder="1.19378">
</div>

<div>
<label>P&L ($) <span style="text-transform:none;color:#66728c">(optional)</span></label>
<input id="pnl" type="number" step="any" placeholder="138.51 or -50">
</div>

</div>

<div class="rr">
<span>Calculated R:R</span>
<strong id="rr">—</strong>
</div>
</div>

<div class="card">
<div class="section">ICT Context</div>

<div class="grid">

<div>
<label>HTF Context</label>
<select id="htf">
<option>Choose...</option>
<option>Bullish</option>
<option>Bearish</option>
<option>Neutral</option>
<option>Range</option>
</select>
</div>

<div>
<label>Killzone Window</label>
<select id="killzone">
<option>Choose...</option>
<option>London</option>
<option>New York AM</option>
<option>New York PM</option>
<option>Silver Bullet</option>
<option>Other</option>
</select>
</div>

<div>
<label>Liquidity Swept</label>
<select id="liquidity">
<option>Choose...</option>
<option>PDH</option>
<option>PDL</option>
<option>Asia High</option>
<option>Asia Low</option>
<option>London High</option>
<option>London Low</option>
<option>Equal Highs</option>
<option>Equal Lows</option>
<option>Other</option>
<option>None</option>
</select>
</div>

<div>
<label>Setup / Model</label>
<input id="setup" placeholder="Unicorn / FVG / OB">
</div>

<div class="full">
<label>Loss Category / Invalidation</label>
<select id="invalid">
<option>None</option>
<option>Wrong HTF Context</option>
<option>No Liquidity Sweep</option>
<option>Wrong Killzone</option>
<option>Entry Too Early</option>
<option>Entry Too Late</option>
<option>Invalid FVG</option>
<option>Invalid OB</option>
<option>Structure Invalidated</option>
<option>Overtrading</option>
<option>Early BE</option>
<option>Other</option>
</select>
</div>

<div class="full">
<label>Notes</label>
<textarea id="notes" placeholder="What did you see? What did you do well? What went wrong?"></textarea>
</div>

</div>

<div class="buttons">
<button id="save">Save Trade</button>
<button class="secondary" id="clear">Clear</button>
</div>

</div>

<div class="card">
<div class="section">Saved Trades</div>
<div id="trades"></div>
</div>

<div class="buttons">
<button class="blue" onclick="location.href='journal.html'">📊 Open Journal</button>
</div>

</div>

<script>
const $=id=>document.getElementById(id);
let trades=JSON.parse(localStorage.getItem("ictTrades")||"[]");
let editId=null;

function nowLocal(){
const d=new Date();
d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
return d.toISOString().slice(0,16);
}

$("datetime").value=nowLocal();

function calcRR(){
const e=+$("entry").value;
const sl=+$("sl").value;
const tp=+$("tp").value;
if(!e||!sl||!tp)return null;

const risk=Math.abs(e-sl);
const reward=Math.abs(tp-e);
if(!risk)return null;

return reward/risk;
}

function showRR(){
const r=calcRR();
$("rr").textContent=r?`1:${r.toFixed(2)}`:"—";
}

["entry","sl","tp"].forEach(x=>$(x).addEventListener("input",showRR));

function save(){
const trade={
id:editId||Date.now(),
pair:$("pair").value.trim()||"Unknown",
direction:$("direction").value,
datetime:$("datetime").value,
entry:$("entry").value,
sl:$("sl").value,
tp:$("tp").value,
pnl:$("pnl").value===""?null:+$("pnl").value,
rr:calcRR(),
result:$("result").value,
htf:$("htf").value,
killzone:$("killzone").value,
liquidity:$("liquidity").value,
setup:$("setup").value,
invalid:$("invalid").value,
notes:$("notes").value
};

if(editId){
const i=trades.findIndex(t=>t.id===editId);
if(i>=0)trades[i]=trade;
editId=null;
}else{
trades.unshift(trade);
}

localStorage.setItem("ictTrades",JSON.stringify(trades));
clearForm();
render();
alert("Trade saved.");
}

function clearForm(){
["pair","entry","sl","tp","pnl","setup","notes"].forEach(id=>$(id).value="");
$("direction").value="BUY";
$("result").value="OPEN";
$("htf").value="Choose...";
$("killzone").value="Choose...";
$("liquidity").value="Choose...";
$("invalid").value="None";
$("datetime").value=nowLocal();
$("rr").textContent="—";
editId=null;
}

function editTrade(id){
const t=trades.find(x=>x.id===id);
if(!t)return;

editId=id;

$("pair").value=t.pair||"";
$("direction").value=t.direction||"BUY";
$("datetime").value=t.datetime||nowLocal();
$("entry").value=t.entry??"";
$("sl").value=t.sl??"";
$("tp").value=t.tp??"";
$("pnl").value=t.pnl??"";
$("result").value=t.result||"OPEN";
$("htf").value=t.htf||"Choose...";
$("killzone").value=t.killzone||"Choose...";
$("liquidity").value=t.liquidity||"Choose...";
$("setup").value=t.setup||"";
$("invalid").value=t.invalid||"None";
$("notes").value=t.notes||"";

showRR();
window.scrollTo({top:0,behavior:"smooth"});
}

function deleteTrade(id){
if(!confirm("Delete this trade?"))return;
trades=trades.filter(t=>t.id!==id);
localStorage.setItem("ictTrades",JSON.stringify(trades));
render();
}

function esc(x){
return String(x??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));
}

function render(){
const box=$("trades");

if(!trades.length){
box.innerHTML='<div class="empty">No trades yet.<br>Save your first backtest trade above.</div>';
return;
}

box.innerHTML=trades.map(t=>{
let cls=t.result==="WIN"?"win":t.result==="LOSS"?"loss":t.result==="BREAKEVEN"?"be":"open";
let pnl=t.pnl==null?"":` • ${t.pnl>=0?"+":""}$${Number(t.pnl).toFixed(2)}`;

return `
<div class="trade">
<div class="tradeTop">
<div>
<strong>${esc(t.pair)} ${esc(t.direction)}</strong>
<div class="meta">${esc(t.datetime)} • R:R ${t.rr?`1:${Number(t.rr).toFixed(2)}`:"—"}${pnl}</div>
</div>
<span class="badge ${cls}">${esc(t.result)}</span>
</div>

<div class="meta">
${esc(t.htf)} • ${esc(t.killzone)} • Liquidity: ${esc(t.liquidity)}
</div>

<div class="meta">
Setup: ${esc(t.setup)} • Invalidation: ${esc(t.invalid)}
</div>

<div class="actions">
<button class="small blue" onclick="editTrade(${t.id})">Edit</button>
<button class="small danger" onclick="deleteTrade(${t.id})">Delete</button>
</div>
</div>`;
}).join("");
}

$("save").onclick=save;
$("clear").onclick=clearForm;

render();
</script>
</body>
</html>
