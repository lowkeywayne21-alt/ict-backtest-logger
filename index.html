<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<title>ICT Backtest Logger V2.2</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0d1117;
color:#e6edf3;
font-family:Arial,sans-serif;
padding-bottom:40px
}

header{
background:#111827;
border-bottom:1px solid #273447;
padding:16px 20px;
position:sticky;
top:0;
z-index:10
}

h1{
font-size:20px;
margin:0 0 4px
}

.subtitle{
color:#8b98aa;
font-size:12px
}

main{
max-width:720px;
margin:auto;
padding:14px
}

.card{
background:#151c26;
border:1px solid #273447;
border-radius:12px;
padding:18px;
margin-bottom:14px
}

h2{
font-size:13px;
text-transform:uppercase;
letter-spacing:.8px;
margin:0 0 14px;
color:#c9d4e2;
border-bottom:1px solid #232f3e;
padding-bottom:6px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

label{
font-size:12px;
color:#91a0b4;
display:flex;
flex-direction:column;
gap:6px
}

.wide{
grid-column:1/-1
}

input,select,textarea{
width:100%;
background:#0d131c;
color:#e6edf3;
border:1px solid #344258;
border-radius:8px;
padding:11px;
font-size:14px;
min-height:42px
}

textarea{
resize:vertical
}

/* Multi-select box styling */
.checkboxGroup{
background:#0d131c;
border:1px solid #344258;
border-radius:8px;
padding:10px;
max-height:140px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:8px
}

.checkboxItem{
display:flex;
align-items:center;
gap:8px;
font-size:12px;
color:#dce6f2;
cursor:pointer
}

.checkboxItem input[type="checkbox"]{
width:16px;
height:16px;
min-height:auto;
accent-color:#2563eb;
cursor:pointer
}

.metrics{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:14px
}

.metric{
background:#0d131c;
border:1px solid #273447;
border-radius:8px;
padding:12px;
text-align:center
}

.metric span{
display:block;
font-size:10px;
color:#7f8da1;
margin-bottom:4px
}

.metric b{
font-size:18px
}

.open{color:#f4c95d}
.win{color:#5ee18b}
.loss{color:#ff7b89}
.be{color:#38bdf8}

.buttons{
display:flex;
gap:10px;
margin-top:14px
}

button{
border:0;
border-radius:8px;
padding:12px;
font-weight:bold;
font-size:13px;
cursor:pointer
}

.primary{background:#2563eb;color:white;flex:1}
.secondary{background:#263447;color:#dce6f2;flex:1}
.danger{background:#351b20;color:#ffb4b4;width:100%}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:12px
}

.stat{
background:#0d131c;
border:1px solid #273447;
border-radius:8px;
padding:10px;
text-align:center
}

.stat b{
font-size:16px;
display:block
}

.stat span{
font-size:10px;
color:#7f8da1
}

.trade{
border-top:1px solid #273447;
padding:12px 2px
}

.trade:first-child{border-top:0}

.tradeTop{
display:flex;
justify-content:space-between;
align-items:center
}

.tradeInfo{
font-size:11px;
color:#8190a4;
margin-top:5px
}

.tradeContext{
font-size:11px;
color:#c3cedb;
margin-top:6px;
line-height:1.4
}

.imageGrid{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
gap:8px;
margin-top:10px
}

.tradeImg{
width:100%;
height:110px;
object-fit:cover;
border-radius:8px;
border:1px solid #344258;
display:block
}

.empty{
text-align:center;
padding:18px;
color:#77869a;
font-size:12px
}

.previewBox{
margin-top:8px;
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:5px
}

.previewBox img{
width:100px;
height:80px;
object-fit:cover;
border-radius:8px;
border:1px dashed #344258;
flex-shrink:0
}

.urlInputGroup{
display:flex;
gap:6px
}

.urlInputGroup button{
padding:0 14px;
white-space:nowrap
}

@media(max-width:480px){
.grid{grid-template-columns:1fr}
main{padding:10px}
.card{padding:14px}
}
</style>
</head>

<body>

<header>
<h1>ICT Backtest Logger</h1>
<div class="subtitle">Mobile V2.2 • Multi-Selection & BE Supported</div>
</header>

<main>

<!-- TRADE INFORMATION -->

<section class="card">

<h2>Trade Information</h2>

<div class="grid">

<label>
Date / Time
<input id="datetime" type="datetime-local">
</label>

<label>
Symbol
<input id="symbol" type="text" value="EURUSD" placeholder="EURUSD">
</label>

<label>
Direction
<select id="direction">
<option>BUY</option>
<option>SELL</option>
</select>
</label>

<label>
Entry
<input id="entry" type="number" step="any" inputmode="decimal">
</label>

<label>
Stop Loss
<input id="sl" type="number" step="any" inputmode="decimal">
</label>

<label>
Take Profit
<input id="tp" type="number" step="any" inputmode="decimal">
</label>

</div>

<div class="metrics">

<div class="metric">
<span>R:R TARGET</span>
<b id="rr">—</b>
</div>

<div class="metric">
<span>RESULT</span>
<b id="result" class="open">OPEN</b>
</div>

</div>

<div class="buttons">
<button class="secondary" onclick="calculateRR()">
CALCULATE R:R
</button>

<button class="primary" onclick="saveTrade()">
SAVE TRADE
</button>
</div>

</section>


<!-- ICT CONTEXT -->

<section class="card">

<h2>ICT Context & Attachments</h2>

<div class="grid">

<label>
HTF Context
<select id="htf">
<option>—</option>
<option>Bullish</option>
<option>Bearish</option>
<option>Neutral</option>
<option>Bullish POI</option>
<option>Bearish POI</option>
<option>Premium</option>
<option>Discount</option>
</select>
</label>

<label>
Killzone Window
<select id="killzone">
<option>—</option>
<option>London</option>
<option>New York AM</option>
<option>New York PM</option>
<option>Silver Bullet</option>
<option>Outside Killzone</option>
</select>
</label>

<label class="wide">
Target Liquidity
<input id="targetLiquidity" type="text" placeholder="e.g. Asian High, PDH, Equal Highs">
</label>

<label class="wide">
Liquidity Swept (Select Multiple)
<div class="checkboxGroup" id="liquidityGroup">
  <label class="checkboxItem"><input type="checkbox" value="BSL"> BSL</label>
  <label class="checkboxItem"><input type="checkbox" value="SSL"> SSL</label>
  <label class="checkboxItem"><input type="checkbox" value="PDH"> PDH</label>
  <label class="checkboxItem"><input type="checkbox" value="PDL"> PDL</label>
  <label class="checkboxItem"><input type="checkbox" value="Asian High"> Asian High</label>
  <label class="checkboxItem"><input type="checkbox" value="Asian Low"> Asian Low</label>
  <label class="checkboxItem"><input type="checkbox" value="Equal Highs"> Equal Highs</label>
  <label class="checkboxItem"><input type="checkbox" value="Equal Lows"> Equal Lows</label>
  <label class="checkboxItem"><input type="checkbox" value="Internal Liquidity"> Internal Liquidity</label>
  <label class="checkboxItem"><input type="checkbox" value="External Liquidity"> External Liquidity</label>
</div>
</label>

<label class="wide">
Loss / Invalidation Factors (Select Multiple)
<div class="checkboxGroup" id="invalidGroup">
  <label class="checkboxItem"><input type="checkbox" value="Against HTF trend"> Against HTF trend</label>
  <label class="checkboxItem"><input type="checkbox" value="Early entry"> Early entry</label>
  <label class="checkboxItem"><input type="checkbox" value="Reversal"> Reversal</label>
  <label class="checkboxItem"><input type="checkbox" value="Engineered liquidity"> Engineered liquidity</label>
  <label class="checkboxItem"><input type="checkbox" value="Trading to opposing PDA"> Trading to opposing PDA</label>
  <label class="checkboxItem"><input type="checkbox" value="Went to TP"> Went to TP</label>
</div>
</label>

<label class="wide">
Upload Screenshots (Select Multiple)
<input id="imageFile" type="file" accept="image/*" multiple onchange="handleMultipleFiles(event)">
</label>

<label class="wide">
Add Image / TradingView Link
<div class="urlInputGroup">
  <input id="imageUrl" type="text" placeholder="https://www.tradingview.com/x/...">
  <button class="secondary" type="button" onclick="addUrlImage()">ADD</button>
</div>
</label>

<div class="wide previewBox" id="previewContainer" style="display:none;"></div>

<label class="wide">
Notes
<textarea id="notes" rows="3" placeholder="Optional notes about the setup..."></textarea>
</label>

</div>

</section>


<!-- JOURNAL -->

<section class="card">

<h2>Trade Journal</h2>

<div class="stats">

<div class="stat">
<b id="totalTrades">0</b>
<span>TRADES</span>
</div>

<div class="stat">
<b id="winRate">—</b>
<span>WIN RATE</span>
</div>

<div class="stat">
<b id="wins">0</b>
<span>WINS / BE</span>
</div>

</div>

<div id="tradeList"></div>

<div class="buttons">
<button class="secondary" onclick="exportCSV()">EXPORT CSV</button>
</div>

<div class="buttons">
<button class="danger" onclick="deleteAllTrades()">DELETE ALL TRADES</button>
</div>

</section>

</main>


<script>

/* =========================
   ICT BACKTEST LOGGER V2.2
   ========================= */

let trades = JSON.parse(localStorage.getItem("ICT_BACKTEST_TRADES") || "[]");
let currentImages = [];

/* AUTOMATIC DATE / TIME */
function setAutomaticDateTime(){
  const now = new Date();
  const offset = now.getTimezoneOffset();
  const localTime = new Date(now.getTime() - offset * 60000);
  document.getElementById("datetime").value = localTime.toISOString().slice(0,16);
}

/* R:R CALCULATOR */
function calculateRR(){
  const entry = parseFloat(document.getElementById("entry").value);
  const sl = parseFloat(document.getElementById("sl").value);
  const tp = parseFloat(document.getElementById("tp").value);
  const direction = document.getElementById("direction").value;

  if(!Number.isFinite(entry) || !Number.isFinite(sl) || !Number.isFinite(tp)){
    document.getElementById("rr").textContent = "—";
    return null;
  }

  let risk = (direction === "BUY") ? (entry - sl) : (sl - entry);
  let reward = (direction === "BUY") ? (tp - entry) : (entry - tp);

  if(risk <= 0 || reward <= 0){
    document.getElementById("rr").textContent = "INVALID";
    return null;
  }

  const rr = reward / risk;
  document.getElementById("rr").textContent = "1:" + rr.toFixed(2);
  return rr;
}

/* RESULT CALCULATOR (INCLUDES BE) */
function determineResult(){
  const entry = parseFloat(document.getElementById("entry").value);
  const sl = parseFloat(document.getElementById("sl").value);
  const tp = parseFloat(document.getElementById("tp").value);
  const direction = document.getElementById("direction").value;

  if(!Number.isFinite(entry) || !Number.isFinite(sl) || !Number.isFinite(tp)){
    return "OPEN";
  }

  const finalPrice = prompt("Enter final exit price (or type 'BE' for Break-Even / 0.00 USD):\n\nCancel = OPEN");
  if(finalPrice === null || finalPrice.trim() === ""){
    return "OPEN";
  }

  const cleanInput = finalPrice.trim().toUpperCase();
  if(cleanInput === "BE" || cleanInput === "0" || cleanInput === "0.00"){
    return "BE";
  }

  const price = parseFloat(cleanInput);
  if(!Number.isFinite(price)){
    return "OPEN";
  }

  if(price === entry) return "BE";

  if(direction === "BUY"){
    if(price >= tp) return "WIN";
    if(price <= sl) return "LOSS";
  }else{
    if(price <= tp) return "WIN";
    if(price >= sl) return "LOSS";
  }

  return "OPEN";
}

/* HELPER FOR MULTI-CHECKBOX SELECTION */
function getSelectedCheckboxes(containerId){
  const container = document.getElementById(containerId);
  const checked = container.querySelectorAll("input[type='checkbox']:checked");
  return Array.from(checked).map(cb => cb.value);
}

function clearCheckboxes(containerId){
  const container = document.getElementById(containerId);
  const checked = container.querySelectorAll("input[type='checkbox']");
  checked.forEach(cb => cb.checked = false);
}

/* MULTIPLE FILE HANDLER */
function handleMultipleFiles(event){
  const files = event.target.files;
  if(!files || files.length === 0) return;

  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.src = e.target.result;
      img.onload = function(){
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const maxWidth = 700;
        const scale = maxWidth / img.width;
        
        if(scale < 1){
          canvas.width = maxWidth;
          canvas.height = img.height * scale;
        }else{
          canvas.width = img.width;
          canvas.height = img.height;
        }

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const compressedBase64 = canvas.toDataURL("image/jpeg", 0.65);
        currentImages.push(compressedBase64);
        renderPreviews();
      };
    };
    reader.readAsDataURL(file);
  });
}

/* ADD URL IMAGE */
function addUrlImage(){
  const urlInput = document.getElementById("imageUrl");
  const url = urlInput.value.trim();
  if(url !== ""){
    currentImages.push(url);
    urlInput.value = "";
    renderPreviews();
  }
}

/* RENDER PREVIEW BOX */
function renderPreviews(){
  const previewBox = document.getElementById("previewContainer");
  previewBox.innerHTML = "";
  if(currentImages.length === 0){
    previewBox.style.display = "none";
    return;
  }
  previewBox.style.display = "flex";
  currentImages.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    previewBox.appendChild(img);
  });
}

/* SAVE TRADE */
function saveTrade(){
  const rr = calculateRR();

  if(rr === null){
    alert("Please enter a valid Entry, Stop Loss and Take Profit.");
    return;
  }

  let result = document.getElementById("result").textContent;
  if(result === "OPEN"){
    result = determineResult();
  }

  const datetime = document.getElementById("datetime").value;

  const trade = {
    id: Date.now(),
    datetime: datetime,
    symbol: document.getElementById("symbol").value.trim() || "EURUSD",
    direction: document.getElementById("direction").value,
    entry: parseFloat(document.getElementById("entry").value),
    sl: parseFloat(document.getElementById("sl").value),
    tp: parseFloat(document.getElementById("tp").value),
    rr: rr,
    result: result,
    htf: document.getElementById("htf").value,
    killzone: document.getElementById("killzone").value,
    targetLiquidity: document.getElementById("targetLiquidity").value.trim(),
    liquidity: getSelectedCheckboxes("liquidityGroup"),
    invalid: getSelectedCheckboxes("invalidGroup"),
    images: [...currentImages],
    notes: document.getElementById("notes").value.trim()
  };

  try {
    trades.push(trade);
    localStorage.setItem("ICT_BACKTEST_TRADES", JSON.stringify(trades));
  } catch (e) {
    alert("Storage limit reached! Try using TradingView links or deleting older trades.");
    trades.pop();
    return;
  }

  document.getElementById("result").textContent = result;
  updateResultColor();
  renderTrades();
  clearInputs();

  alert("Trade saved successfully!");
}

/* RESULT COLOR */
function updateResultColor(){
  const element = document.getElementById("result");
  element.className = "";
  if(element.textContent === "WIN") element.classList.add("win");
  else if(element.textContent === "LOSS") element.classList.add("loss");
  else if(element.textContent === "BE") element.classList.add("be");
  else element.classList.add("open");
}

/* CLEAR INPUTS */
function clearInputs(){
  document.getElementById("notes").value = "";
  document.getElementById("targetLiquidity").value = "";
  document.getElementById("imageFile").value = "";
  document.getElementById("imageUrl").value = "";
  document.getElementById("previewContainer").style.display = "none";
  clearCheckboxes("liquidityGroup");
  clearCheckboxes("invalidGroup");
  currentImages = [];
}

/* DISPLAY TRADES */
function renderTrades(){
  const list = document.getElementById("tradeList");
  const total = trades.length;
  const wins = trades.filter(trade => trade.result === "WIN").length;
  const losses = trades.filter(trade => trade.result === "LOSS").length;
  const bes = trades.filter(trade => trade.result === "BE").length;

  let winRate = "—";
  if(wins + losses > 0){
    winRate = ((wins / (wins + losses)) * 100).toFixed(1) + "%";
  }

  document.getElementById("totalTrades").textContent = total;
  document.getElementById("wins").textContent = `${wins}W / ${bes}BE`;
  document.getElementById("winRate").textContent = winRate;

  if(total === 0){
    list.innerHTML = '<div class="empty">No trades recorded yet.</div>';
    return;
  }

  list.innerHTML = "";
  const reversed = [...trades].reverse();

  reversed.forEach(trade => {
    const div = document.createElement("div");
    div.className = "trade";

    let resultClass = "open";
    if(trade.result === "WIN") resultClass = "win";
    if(trade.result === "LOSS") resultClass = "loss";
    if(trade.result === "BE") resultClass = "be";

    const date = new Date(trade.datetime).toLocaleString();

    let imageGridHTML = "";
    const imgs = trade.images || (trade.image ? [trade.image] : []);
    if(imgs.length > 0){
      imageGridHTML = '<div class="imageGrid">' + imgs.map(imgSrc => 
        `<a href="${escapeHTML(imgSrc)}" target="_blank">
          <img class="tradeImg" src="${escapeHTML(imgSrc)}" alt="Chart Setup">
        </a>`
      ).join('') + '</div>';
    }

    const liqText = Array.isArray(trade.liquidity) ? trade.liquidity.join(", ") : (trade.liquidity || "—");
    const invText = Array.isArray(trade.invalid) ? trade.invalid.join(", ") : (trade.invalid || "—");

    div.innerHTML = `
      <div class="tradeTop">
        <b>${escapeHTML(trade.symbol || "EURUSD")} ${escapeHTML(trade.direction)}</b>
        <b class="${resultClass}">${escapeHTML(trade.result)}</b>
      </div>
      <div class="tradeInfo">
        ${date} • R:R 1:${Number(trade.rr).toFixed(2)} • Entry ${trade.entry} • SL ${trade.sl} • TP ${trade.tp}
      </div>
      <div class="tradeContext">
        <b>HTF:</b> ${escapeHTML(trade.htf)} • <b>KZ:</b> ${escapeHTML(trade.killzone)} <br>
        <b>Target Liq:</b> ${escapeHTML(trade.targetLiquidity || "—")}<br>
        <b>Swept:</b> ${escapeHTML(liqText || "None")} <br>
        <b>Invalidation:</b> ${escapeHTML(invText || "None")}
      </div>
      ${trade.notes ? `<div class="tradeContext"><i>Notes: ${escapeHTML(trade.notes)}</i></div>` : ""}
      ${imageGridHTML}
    `;

    list.appendChild(div);
  });
}

/* ESCAPE HTML */
function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* EXPORT CSV */
function exportCSV(){
  if(trades.length === 0){
    alert("There are no trades to export.");
    return;
  }

  const columns = ["datetime","symbol","direction","entry","sl","tp","rr","result","htf","killzone","targetLiquidity","liquidity","invalid","images","notes"];
  let csv = columns.join(",") + "\n";

  trades.forEach(trade => {
    const row = columns.map(column => {
      let value = trade[column] ?? "";
      if(Array.isArray(value)) value = value.join(" | ");
      return '"' + String(value).replace(/"/g,'""') + '"';
    });
    csv += row.join(",") + "\n";
  });

  const blob = new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "ICT_Backtest_Trades.csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

/* DELETE ALL */
function deleteAllTrades(){
  if(trades.length === 0){
    alert("There are no trades to delete.");
    return;
  }

  if(!confirm("Are you sure you want to delete ALL saved trades?")) return;

  trades = [];
  localStorage.setItem("ICT_BACKTEST_TRADES", "[]");
  renderTrades();
  alert("All trades deleted.");
}

/* AUTOMATIC R:R UPDATE */
["entry","sl","tp","direction"].forEach(id => {
  document.getElementById(id).addEventListener("input", function(){
    calculateRR();
    document.getElementById("result").textContent = "OPEN";
    updateResultColor();
  });
});

/* START */
setAutomaticDateTime();
renderTrades();

</script>

</body>
</html>
